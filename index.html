<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <title>Eleanor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳至内容</a>
  <header class="site-header">
    <a class="site-mark" href="index.html" aria-label="首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h13v18H5zM11 4h16v19h-5M9 19l3-4 3 3"/></svg></a>
    <nav aria-label="页面"><a href="index.html" data-nav="home">首页</a><span aria-hidden="true">/</span><a href="voices.html" data-nav="voices">语音贺卡</a><span aria-hidden="true">/</span><a href="photos.html" data-nav="photos">相册</a></nav>
  </header>
  <main id="main" class="page home-page" tabindex="-1">
    <header id="hero" class="hero" hidden><h1 id="hero-title" hidden></h1><p id="hero-body" hidden></p></header>
    <section class="gift-intro" aria-label="页面入口">
      <a href="voices.html" class="letter-entry" aria-label="打开语音贺卡">
        <span class="entry-paper" aria-hidden="true"><span class="paper-lines"></span></span>
        <span class="entry-envelope" aria-hidden="true"><span class="envelope-fold"></span><span class="wax-seal" id="voice-entry-count">09</span></span>
        <span class="entry-label"><span data-label="message">语音贺卡</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span>
      </a>
      <a href="photos.html" class="album-entry" aria-label="打开相册">
        <span class="album-cover" aria-hidden="true"><span class="album-spine"></span><span class="album-frame"><svg viewBox="0 0 32 32"><path d="M5 5h22v22H5zM5 23l8-10 6 7 3-3 5 6"/><circle cx="22" cy="11" r="2"/></svg></span><span id="album-entry-count" class="album-count">06</span></span>
        <span class="entry-label"><span data-label="album">相册</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span>
      </a>
    </section>
    <footer class="home-music"><div id="music-player" class="music-mini"></div><button id="parcel-replay" class="text-button parcel-replay" type="button" hidden data-label="replayOpening">重播开场</button></footer>
    <noscript>请启用 JavaScript 以使用播放器和照片查看器。</noscript>
  </main>
  <dialog id="parcel-dialog" class="parcel-dialog" aria-labelledby="parcel-heading" aria-describedby="parcel-hint">
    <div class="parcel-content">
      <h2 id="parcel-heading" class="parcel-heading"></h2>
      <button id="parcel-open" class="parcel-open" type="button" aria-label="拆开包裹">
        <span class="parcel-scene" aria-hidden="true">
          <span class="parcel-inside"><span class="parcel-inside-name"></span></span>
          <span class="parcel-flap parcel-left"></span><span class="parcel-flap parcel-right"></span>
          <span class="parcel-flap parcel-bottom"></span><span class="parcel-flap parcel-top"></span>
          <span class="parcel-ribbon parcel-ribbon-v"></span><span class="parcel-ribbon parcel-ribbon-h"></span>
          <span class="parcel-seal"><svg viewBox="0 0 24 24"><path d="M3 8h18v13H3zM2 5h20v4H2zM12 5v16M12 5C3 5 5-3 12 5Zm0 0c9 0 7-8 0 0Z"/></svg></span>
        </span>
      </button>
      <p id="parcel-hint" class="parcel-hint" data-label="openParcel">轻触拆开包裹</p>
      <button id="parcel-skip" class="text-button parcel-skip" type="button" data-label="skipOpening">跳过开场</button>
    </div>
  </dialog>
</body>
</html>
