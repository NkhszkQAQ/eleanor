<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <title>语音贺卡 · 音乐 · 照片</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至内容</a>
  <main id="main" class="page" tabindex="-1">
    <header id="hero" class="hero" hidden>
      <h1 id="hero-title" hidden></h1>
      <p id="hero-body" hidden></p>
    </header>
    <div id="players" class="players"></div>
    <section id="photos" class="photos" aria-labelledby="photos-heading">
      <div class="section-heading">
        <h2 id="photos-heading">照片</h2>
        <span id="photo-count" class="section-count" aria-hidden="true"></span>
      </div>
      <div id="photo-grid" class="photo-grid"></div>
      <p id="photos-empty" class="empty-state" hidden></p>
    </section>
    <noscript>请启用 JavaScript 以使用播放器和照片查看器。</noscript>
  </main>
  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <div class="viewer-panel">
      <div class="viewer-toolbar">
        <h2 id="viewer-title">照片</h2>
        <button id="viewer-close" class="icon-button" type="button" aria-label="关闭图片查看器" autofocus></button>
      </div>
      <div id="viewer-stage" class="viewer-stage" aria-busy="false">
        <p id="viewer-status" role="status"></p>
      </div>
      <div class="viewer-navigation">
        <button id="viewer-prev" class="icon-button" type="button" aria-label="上一张"></button>
        <p id="viewer-counter" aria-live="polite" aria-atomic="true"></p>
        <button id="viewer-next" class="icon-button" type="button" aria-label="下一张"></button>
      </div>
      <p id="viewer-caption" class="viewer-caption" hidden></p>
    </div>
  </dialog>
</body>
</html>
